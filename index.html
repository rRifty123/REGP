<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGP - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <!-- Login/Signup Card -->
        <section id="auth-screen" class="auth-card">
            <div class="card-header">
                <p>You are logging into: <strong>REGP Reading</strong></p>
            </div>
            
            <div class="card-body">
                <h2>Log in as a student or teacher</h2>
                
                <!-- Teacher Shortcut -->
                <button id="teacher-mode-btn" class="microsoft-btn">
                    <span class="icon">🏫</span> Log in / Sign up as a Teacher
                </button>

                <div class="separator"><span>or</span></div>

                <h3>Use your REGP login</h3>
                <div class="input-group">
                    <label>Email:</label>
                    <input type="email" id="email" placeholder="email@school.com">
                </div>
                <div class="input-group">
                    <label>Password:</label>
                    <input type="password" id="password" placeholder="Password">
                </div>

                <button id="login-btn" class="login-main-btn">Log in</button>

                <div class="card-footer">
                    <a href="#" id="signup-student-link">New student?</a> | <a href="#">Forgot login details?</a>
                </div>
            </div>
        </section>

        <!-- Hidden Admin / Dashboards (Simplified for logic) -->
        <section id="student-dashboard" style="display:none;">
            <h1>Student Dashboard</h1>
            <button onclick="location.reload()">Logout</button>
            <button id="settings-btn" style="opacity:0.1">Secret</button>
        </section>

        <section id="teacher-dashboard" style="display:none;">
            <h1>Teacher Dashboard</h1>
            <button onclick="location.reload()">Logout</button>
        </section>
        
        <section id="admin-panel" style="display:none;">
            <h1>Admin Panel</h1>
            <button onclick="location.reload()">Back</button>
        </section>
    </div>

    <!-- Scripts at the bottom to ensure buttons are loaded -->
    <script type="module" src="app.js"></script>
</body>
</html>
